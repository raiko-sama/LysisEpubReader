[platformio]
boards_dir = boards

[env:m5stack-papers3]
platform = espressif32@6.12.0
board = m5stack-papers3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
boards_dir = boards
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.psram_type = opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DCORE_DEBUG_LEVEL=1
    -UMINIZ_NO_DEFLATE_APIS
    -I src
    -DDEV_INJECT=1
    -DDIAG_LOG=0
lib_deps =
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
build_unflags =
    -std=gnu++11
build_src_flags =
    -std=gnu++17
extra_scripts = post:tools/merge_firmware.py

; Headless emulator test build (QEMU esp32s3): hardware touching stubs,
; UART0 logs, self-tests for pagination/search and deep-sleep standby.
[env:qemu]
extends = env:m5stack-papers3
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env:m5stack-papers3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DAPP_QEMU=1
board_build.partitions = partitions.csv
extra_scripts = post:tools/merge_firmware.py
